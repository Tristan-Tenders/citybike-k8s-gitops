apiVersion: apps/v1
kind: Deployment
metadata:
  name: citybike
  labels:
    app.kubernetes.io/name: citybike
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: citybike
  template:
    metadata:
      labels:
        app.kubernetes.io/name: citybike
    spec:
      terminationGracePeriodSeconds: 10
      # The app never calls the Kubernetes API: do not mount a token it could leak.
      automountServiceAccountToken: false
      securityContext:
        # node:22-alpine defaults to root; run as its built-in "node" user (uid/gid 1000).
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: citybike
          image: node:22-alpine
          imagePullPolicy: IfNotPresent
          command: ["node", "/opt/citybike/server.js"]
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: APP_RELEASE
              value: "v2"
            - name: READY_MODE
              value: "ok"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          volumeMounts:
            - name: app-code
              mountPath: /opt/citybike
              readOnly: true
      volumes:
        - name: app-code
          configMap:
            name: citybike-script
